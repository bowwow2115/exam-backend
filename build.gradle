plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.psh'
version = '0.0.1-SNAPSHOT'
description = 'exam'

ext {
    querydslVersion = '5.1.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation "com.querydsl:querydsl-jpa:${querydslVersion}:jakarta"
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta"
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

def frontendDir = layout.projectDirectory.dir('src/main/resources/frontend')
def frontendDist = frontendDir.dir('dist')

tasks.register('npmBuild', Exec) {
    group = 'build'
    description = 'Runs npm ci && npm run build in the Vue frontend (use -PskipFrontendBuild to skip)'
    workingDir = frontendDir
    commandLine 'sh', '-c', 'npm ci && npm run build'
    inputs.dir(frontendDir.dir('src'))
    inputs.files(
            frontendDir.file('package.json'),
            frontendDir.file('package-lock.json'),
            frontendDir.file('vite.config.js'),
            frontendDir.file('index.html')
    )
    outputs.dir(frontendDist)
    onlyIf { !project.hasProperty('skipFrontendBuild') }
}

tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    if (!project.hasProperty('skipFrontendBuild')) {
        dependsOn('npmBuild')
    }
    if (!project.hasProperty('skipFrontendBuild') || frontendDist.asFile.exists()) {
        from(frontendDist) {
            into 'static'
        }
    }
}
