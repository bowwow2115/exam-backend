services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exam-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/exam
      DB_USERNAME: exam
      DB_PASSWORD: exam
      DDL_AUTO: update
      JWT_SECRET: change-this-secret-key-for-docker-compose-local-dev
      JWT_EXPIRATION_SECONDS: 86400
    ports:
      - "8099:8099"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: exam-postgres
    environment:
      POSTGRES_DB: exam
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam -d exam"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
